<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madina Perfumes VIP Club</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#080808,#151515);
color:#f6e8c6;
display:flex;justify-content:center;align-items:center;
min-height:100vh;padding:30px}
.card{
width:100%;max-width:760px;
background:#111;
border:1px solid #9b6d2f;
border-radius:22px;
padding:40px;
box-shadow:0 0 40px rgba(212,170,74,.18)}
.logo{display:block;margin:0 auto 18px;width:170px;max-width:55%}
h1{font-size:56px;text-align:center;letter-spacing:4px;color:#f7f0e3}
.tag{color:#d8b56a;text-align:center;font-size:30px;font-weight:bold}
.sub{text-align:center;color:#ddd;margin:14px 0 28px;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:30px}
.item{border:1px solid #8b6b2b;border-radius:14px;padding:18px;color:#f5e7c0;text-align:center}
label{display:block;margin:14px 0 8px;font-weight:bold;color:#e8c56d}
input{
width:100%;padding:16px;background:#1b1b1b;color:#fff;
border:1px solid #555;border-radius:10px;font-size:16px}
button{
width:100%;margin-top:24px;padding:18px;border:none;border-radius:40px;
background:linear-gradient(90deg,#c8952f,#f0d07d);
font-size:22px;font-weight:bold;cursor:pointer}
.note{text-align:center;color:#aaa;margin-top:18px}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
h1{font-size:42px}.tag{font-size:24px}.sub{font-size:18px}
.card{padding:22px}
}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" class="logo" alt="Madina Perfumes Logo">
<h1>VIP CLUB</h1>
<div class="sub">Experience the Art of Luxury Fragrance</div>

<div class="grid">
<div class="item">👑 Early access to new launches</div>
<div class="item">🎁 VIP-only offers</div>
<div class="item">💬 Exclusive WhatsApp updates</div>
<div class="item">💎 Member-only surprises</div>
</div>

<form id="vipForm">
  <label>Full Name *</label>
  <input type="text" id="name" placeholder="Enter your full name" required>

  <label>WhatsApp Number *</label>
  <input type="tel" id="phone" placeholder="Enter your WhatsApp number" required>

  <label>City (Optional)</label>
  <input type="text" id="city" placeholder="Your city">

  <button type="submit">JOIN THE VIP CLUB</button>
</form>

<script>
document.getElementById("vipForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        city: document.getElementById("city").value
    };

    try {
        const response = await fetch("https://script.google.com/macros/s/AKfycby99OLTl0Td2zwiIqYNnSqe8lGKhD0KGIBOqjMOTv_axnWq5SB5c4yICVw4L_CgpqWPgA/exec", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        alert("🎉 Welcome to Madina Perfumes VIP Club!");
        document.getElementById("vipForm").reset();

    } catch (error) {
        alert("❌ Submission failed.");
        console.log(error);
    }
});
</script>
<div class="note">🔒 Your information is secure and will only be used for VIP benefits.</div>
</div>
</body>
</html>
