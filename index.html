<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madina Perfumes VIP Club</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#181818;
max-width:420px;
width:100%;
padding:35px;
border-radius:20px;
border:1px solid #b8862b;
box-shadow:0 0 30px rgba(184,134,43,.3);
}

.logo{
display:block;
margin:auto;
width:150px;
margin-bottom:20px;
}

h1{
color:#d4af37;
text-align:center;
margin-bottom:8px;
}

p{
color:#cccccc;
text-align:center;
margin-bottom:25px;
font-size:15px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
color:white;
font-weight:bold;
}

input{
width:100%;
padding:14px;
background:#252525;
border:1px solid #555;
border-radius:10px;
color:white;
font-size:16px;
}

button{
width:100%;
margin-top:25px;
padding:15px;
background:#d4af37;
border:none;
border-radius:50px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.note{
margin-top:15px;
font-size:13px;
text-align:center;
color:#999;
}
</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo">

<h1>VIP CLUB</h1>

<p>Join the Madina Perfumes VIP Club and receive exclusive offers, launches and WhatsApp updates.</p>

<form id="vipForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>WhatsApp Number</label>
<input type="tel" id="phone" required>

<label>City (Optional)</label>
<input type="text" id="city">

<button type="submit">
JOIN NOW
</button>

</form>

<div class="note">
Your information is secure🔒.
</div>

</div>

<script>

document.getElementById("vipForm").addEventListener("submit",async function(e){

e.preventDefault();

const data={
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
city:document.getElementById("city").value
};

try{

const formData = new FormData();

formData.append("entry.569692674", data.name);
formData.append("entry.1927841658", data.phone);
formData.append("entry.1566345613", data.city);

await fetch(
  "https://docs.google.com/forms/d/e/1FAIpQLSdB7b_5AsQTYPGsjAWsFsx_17ihSy_0o3_HADvFOcPvjNyAYw/formResponse",
  {
    method: "POST",
    mode: "no-cors",
    body: formData
  }
);

await Swal.fire({
    icon: "success",
    title: "Welcome!",
    html: "<b>You're now a member of the Madina Perfumes VIP Club.</b><br><br>Thank you for joining us.",
    background: "#111",
    color: "#fff",
    confirmButtonColor: "#C8A86B",
    confirmButtonText: "Continue"
});

window.open(
"https://wa.me/"+data.phone+"?text="+encodeURIComponent("Welcome to Madina Perfumes VIP Club 🌹 Thank you for joining us!"),
"_blank"
);

document.getElementById("vipForm").reset();

}

catch(err){

alert("Something went wrong. Please try again.");

}

});

</script>
src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
</script>

<script>
</body>
</html>
